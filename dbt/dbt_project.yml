name: "tritoneta"
version: "0.1.0"
config-version: 2

profile: "tritoneta"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # MTS runs on Pacific time. Every timestamp lands in the warehouse as UTC and
  # is converted at the mart layer, so "delays are worst at 5pm" means 5pm here.
  local_timezone: "America/Los_Angeles"

  # A trip_update whose predicted arrival is further out than this is mostly the
  # scheduler guessing, not a measurement. Excluded from training labels.
  max_prediction_horizon_minutes: 60

  # |delay| beyond this is a feed artifact (stuck vehicle, clock skew, trip
  # rollover at midnight), not a real 4-hour bus delay.
  delay_outlier_threshold_seconds: 5400

models:
  tritoneta:
    +materialized: view
    staging:
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
