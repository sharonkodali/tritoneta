# Checked in on purpose: it holds no secrets, just a path to the local DuckDB file.
# dbt finds it because `dbt run` is invoked from this directory (or with
# --profiles-dir dbt). Override the location with DUCKDB_PATH / DBT_RAW_DIR.

tritoneta:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/warehouse.duckdb') }}"
      threads: 4
      extensions:
        - httpfs
        - parquet
